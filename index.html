<!doctype html>
<html lang="es">
  <head>
    <script>
      (function() {
        function sendLog(type, data) {
          try {
            fetch('/api/client-log', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: type, data: data, url: window.location.href })
            }).catch(function() {});
          } catch(e) {}
        }
        window.addEventListener('error', function(e) {
          sendLog('window.error', {
            message: e.message,
            filename: e.filename,
            lineno: e.lineno,
            colno: e.colno,
            error: e.error ? (e.error.stack || e.error.message || String(e.error)) : null
          });
        });
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (String(event.reason).includes('WebSocket') || String(event.reason).includes('[vite]'))) {
            event.preventDefault();
            return;
          }
          sendLog('unhandledrejection', {
            reason: event.reason ? (event.reason.stack || event.reason.message || String(event.reason)) : String(event)
          });
        });
        const origError = console.error;
        console.error = function(...args) {
          const msg = args.map(function(a) { return String(a || ''); }).join(' ');
          if (!msg.includes('WebSocket') && !msg.includes('[vite]')) {
            sendLog('console.error', msg);
          }
          origError.apply(console, args);
        };
      })();

      // Safely unregister any stale Service Worker and purge old app cache on preview URLs
      try {
        if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function() {});
        }
        if (typeof window !== 'undefined' && 'caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              caches.delete(keys[i]);
            }
          }).catch(function() {});
        }
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remix Seminario Teológico Digital</title>
    <meta name="description" content="Plataforma educativa de Teología y Estudios Bíblicos con Asistente Virtual Teológico interactivo." />
    
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    
    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A2533" />
    
    <!-- iOS / Mobile Web App Touch capability & styles -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Seminario" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root">
      <div id="initial-loading-fallback" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #FAF9F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1A2533; text-align: center; padding: 24px;">
        <div style="width: 56px; height: 56px; background-color: #7F1D1D; color: #FAF9F5; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(127, 29, 29, 0.3);">
          📖
        </div>
        <div style="font-size: 18px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;">SEMINARIO TEOLÓGICO DIGITAL</div>
        <div style="font-size: 13px; color: #78716c; margin-top: 8px; font-family: Georgia, serif; font-style: italic;">Iniciando campus interactivo...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
