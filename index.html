<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Seminario Teológico Digital</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <script>
      document.body.style.background = 'purple';
      console.log('Inline script executed');
    </script>
    <div id="root">
      <div style="padding: 20px; text-align: center;">
        <h2>Cargando sistema...</h2>
        <p>Si este mensaje no desaparece, hay un problema cargando los scripts.</p>
      </div>
    </div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.background = 'red';
        errorDiv.style.color = 'white';
        errorDiv.style.padding = '20px';
        errorDiv.style.zIndex = '10000';
        errorDiv.innerHTML = '<strong>Error Crítico:</strong> ' + msg + '<br><em>' + url + ':' + line + '</em>';
        document.body.appendChild(errorDiv);
        return false;
      };
      window.onunhandledrejection = function(event) {
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '50px';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.background = 'orange';
        errorDiv.style.color = 'black';
        errorDiv.style.padding = '20px';
        errorDiv.style.zIndex = '10001';
        errorDiv.innerHTML = '<strong>Promesa Rechazada:</strong> ' + event.reason;
        document.body.appendChild(errorDiv);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
